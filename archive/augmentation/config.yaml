seed: 42

paths:
  raw_root: "DAIS-C-Annotated-Upload/DAIS-C-Annotated - Upload"   # 실제 원본 위치 (./data/ 아님)
  speaker_glob: "DAI-C-{group}/Interactional/Full tagged pass/Speaker_only_for_analysis/*_speaker.txt"
  corpus: "data/processed/corpus.parquet"
  synthetic_dir: "synthetic"
  reports: "reports"

preprocess:
  spacy_model: en_core_web_sm
  min_sentence_tokens: 3          # 미만이면 인접 문장에 병합
  min_response_tokens: 30         # 비교/생성 단위로 쓰는 '실질 응답' 최소 토큰 수

# ---------------------------------------------------------------------------
# 본 연구: 질문-답변 단위 (src/build_qa_units.py). 증강 대신 응답 단위 분할 (reports/08_qa_units.md)
qa:
  full_glob: "DAI-C-{group}/Interactional/Full tagged pass/*-FULL.*"
  metadata: "Metadata/Metadata.xlsx"
  k_sentences: 4                  # 답변 최소 문장 수 = 주 분석에서 쓰는 앞 K문장 (K=5,6은 민감도 분석)
  prompt_min_words: 3             # 면담자 턴에서 맞장구어를 뺀 단어가 이 수 이상이면 '질문' → 기준점 갱신, 미만이면 맞장구 → 답변 이어짐
  backchannel: [er, erm, mm, mhm, hmm, ah, oh, yeah, yes, yep, no, ok, okay, right, alright, sure, really, wow, great, cool, good, fine, uh, huh, aha, i, see]
  tags: [InAu, An, Lh, Gr, WS, TC, DT]   # 답변별 개수 기록 (피처 아님: InAu는 녹음 방식 교락, Gr/WS/TC/DT는 검증 기준)

generate:
  mode: manual                    # API 미사용: 모델(Claude)이 세션 내에서 직접 생성
  seed_segments_per_prompt: [2, 3]
  seed_segment_sentences: [5, 8]
  exclude_speakers: [18UG10]      # 실질 응답 0개, 총 186토큰 -> 시드 구간 불가 (00_exploration §7)
  samples_per_speaker: 4          # CL 14명x4=56
  target_per_group: 56            # CO 13명x4=52 -> 실질 응답 많은 화자 순으로 +1씩 채워 56
  max_target_tokens: 350          # 목표 길이 상한 (실제 실질 응답 중 >350은 소수; 리포트에 명시)
  protocol_min_speakers: 2        # 시드 표현이 이 수 이상 화자(CL+CO)에 등장하면 프로토콜 주제어 → 치환하지 않고 유지
  temperatures: [0.8, 1.0]        # manual 모드에서는 명목상 라벨 (실제 샘플링 파라미터 아님)
  pilot_speakers: {CL: [03AR15, 21AP15], CO: [11AR18, 28CT11]}

validate:
  sbert_model: all-MiniLM-L6-v2
  mattr_window: 50
  ngram_n: 5
  cv_folds: 5
  near_dup_cosine: 0.95
  fillers: [er, erm, um, uh, mm, mhm, ah, oh, like, "you know", "i mean", "kind of", "sort of"]

# ---------------------------------------------------------------------------
# 2차 시도 판정 기준 — 선고정 (2차 생성 전에 커밋됨, 이후 변경 금지). 판정 코드: src/judge.py
# 지표는 1차 validate.py 산출(validation_metrics.json)을 그대로 사용한다.
thresholds:
  fidelity:
    # 대상 = 실제에서 응답 단위 BH q < 0.05 인 CL−CO 차이 피처 (1차: 8개)
    alpha: 0.05
    pass_min_direction_match: 6     # 사용자 제안값: 8개 중 6개 이상 방향 일치 = 합격
    caution_min_direction_match: 4  # [추가] 4-5개 = 주의, 3개 이하 = 불합격. 근거: 제안안에 주의 구간이 없어 절반 보존을 경계로 둠
    # 가짜 효과 = 실제 q >= alpha 인데 합성 q < alpha. 1개라도 있으면 개수 무관 불합격 (사용자 제안값)
    spurious_effect_fails: true
  diversity:
    # 지표 = |합성 간 평균 pairwise cos − 실제 간 평균| (CL, CO 각각; 둘 중 큰 값으로 판정), 준중복 = 1차 정의(cos>=0.95 또는 5-gram Jaccard>=0.3)
    pass_max_abs_diff: 0.05         # 사용자 제안값 (준중복 0 조건과 함께)
    caution_max_abs_diff: 0.15      # [추가] 0.05-0.15 = 주의, 초과 또는 준중복 1쌍 이상 = 불합격. 근거: 1차 CO 차이 0.136을 '주의'로 본 판단과 일관
  memorization:
    # 지표 = pooled 5-gram overlap(합성→전체 실제) / 기준선(실제→다른 화자)
    pass_max_ratio: 1.5             # 사용자 제안값
    caution_max_ratio: 2.5          # 사용자 제안값, 초과 = 불합격
  discriminability:
    # 지표 = TF-IDF+로지스틱 5-fold CV AUC 평균
    pass_max_auc: 0.75              # 사용자 제안값
    caution_max_auc: 0.85           # 사용자 제안값, 초과 = 불합격 (2차 최종에서 초과 시 중단·보고)
  stop_rules:
    pilot_auc_worse_than: 0.94      # 2차 파일럿 AUC가 1차 전체 AUC보다 크면 전체 생성 전 중단
    pilot_max_filter_reject_rate: 0.5

# ---------------------------------------------------------------------------
# 3차 시도: OpenAI Chat Completions 실제 샘플링 (src/generate_v3.py). 키는 .env의 OPENAI_API_KEY에서만 읽는다.
generate_v3:
  model: gpt-4o                 # 예상 비용 > hard_limit_usd 이면 gpt-4o-mini로 내림
  fallback_model: gpt-4o-mini
  temperature: 1.0
  max_tokens_factor: 2.5        # max_tokens = target_words x factor + 50 (잘림 방지 여유)
  hard_limit_usd: 5.0           # 누적 추정 지출이 이 값에 도달하면 즉시 중단
  # 단가 (USD / 1M tokens, 표준 처리, 2026-10-01 developers.openai.com/api/docs/pricing 확인)
  pricing:
    gpt-4o: {input: 2.50, output: 10.00}
    gpt-4o-mini: {input: 0.15, output: 0.60}
  max_attempts: 3               # 최초 + 재샘플링 2회 (post_filter.MAX_ATTEMPTS와 동일)
  api_retry: 1                  # API 오류·거부 시 같은 시도 내 재호출 1회
